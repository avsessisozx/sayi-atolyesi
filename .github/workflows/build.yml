name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Create signing key (random, per build)
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -alias sayi -keyalg RSA -keysize 2048 -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Sayi Atolyesi"
          echo "::add-mask::$PASS"
          echo "KS_PATH=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Read version
        id: v
        run: echo "name=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SayiAtolyesi-v${{ steps.v.outputs.name }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "SayiAtolyesi-v*.apk" }
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          if [ -f RELEASE_NOTES.md ]; then NOTES=RELEASE_NOTES.md; else echo "Sayı Atölyesi $TAG" > n.md; NOTES=n.md; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "SayiAtolyesi-v${{ steps.v.outputs.name }}.apk" --title "Sayı Atölyesi $TAG" --notes-file "$NOTES"
